# Front door. Two jobs: keep slow clients away from uvicorn, and make
# multi-worker safe by pinning each visitor to one worker (jobs are in-memory).

upstream ssc_app {
    # ip_hash = sticky sessions. Every user's submit + long-poll then hits the
    # worker that owns their job. Add more `server` lines (or a second container)
    # and WEB_CONCURRENCY to scale horizontally.
    ip_hash;
    server web:8000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/html application/json text/css application/javascript;
    gzip_min_length 512;

    location / {
        proxy_pass http://ssc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # long-poll answers within 25s; give nginx headroom, never 60s+
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;

        # hundreds of waiting long-polls are normal, not a flood
        proxy_buffering off;
    }

    location = /api/healthz {
        proxy_pass http://ssc_app;
        access_log off;
    }
}
